name: Build and Release Go CLI

on:
  workflow_dispatch: # Allows manual triggering of releases

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod tidy

    - name: Build application
      run: go build -o app ./cmd/

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: go-cli-app
        path: ./app

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: go-cli-app

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: app
        token: ${{ secrets.GH_TOKEN }}
        tag: "v1.0.0" # Update accordingly based on release strategy
        release-name: "Release v1.0.0"
        draft: false
        prerelease: false
        body: "Automated release generated by GitHub Actions."