# NGINX Configuration for Fluxion
# This file tells NGINX how to route traffic

# Main nginx context
events {
    # This is required by nginx syntax
    # worker_connections = max connections per worker process
    worker_connections 1024;
}

http {
    # =========================================
    # UPSTREAM SERVERS (backends to route to)
    # =========================================
    
    # Define the frontend server
    upstream frontend {
        # "frontend" is the Docker service name
        # Port 3000 is where Next.js listens internally
        server frontend:3000;
    }
    
    # Define the backend API server
    upstream backend {
        # "backend" is the Docker service name
        # Port 8080 is where Go server listens internally
        server backend:8080;
    }

    # =========================================
    # SERVER CONFIGURATION (listening on port 80)
    # =========================================
    
    server {
        # Listen on port 80 (HTTP)
        # This is what users/browsers connect to
        listen 80;
        
        # You can set a server name here
        # For now, accept all hostnames
        server_name _;
        
        # =========================================
        # API ROUTING
        # =========================================
        
        # Any request to /api/* goes to the backend
        location /api/ {
            # proxy_pass tells nginx: "Forward this request to this upstream server"
            # When browser requests: /api/commands/generate
            # Nginx forwards to: http://backend:8080/api/commands/generate
            proxy_pass http://backend;
            
            # These proxy_* settings configure how nginx communicates with the backend
            
            # Tell the backend server what the original request hostname was
            proxy_set_header Host $host;
            
            # Tell the backend what the real client IP is
            # (so backend knows the request came from a real user, not from nginx)
            proxy_set_header X-Real-IP $remote_addr;
            
            # Tell the backend the original request protocol (HTTP/HTTPS)
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Tell the backend the original request was for this host
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # =========================================
        # FRONTEND ROUTING
        # =========================================
        
        # Any request that doesn't match /api goes to the frontend
        location / {
            # Forward to the frontend (Next.js)
            proxy_pass http://frontend;
            
            # Same headers as above
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket support (useful for Next.js dev features)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
