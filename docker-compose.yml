services:
  fluxion-be:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: fluxion-be:latest
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - fluxion-network
    restart: unless-stopped

  fluxion-fe:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: fluxion-fe:latest
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    networks:
      - fluxion-network

networks:
  fluxion-network:
    driver: bridge